<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive - PICBLICK Filmclub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="logo.jpg">
</head>
<body>

    <header>
        <nav>
            <div class="logo-container">
                <a href="index.html">
                    <img src="logo.jpg" alt="PICBLICK Logo" class="logo">
                </a>
                <div class="site-title">
                    <h1>PICBLICK</h1>
                    <h2>FILMCLUB MUNICH</h2>
                </div>
            </div>
            <ul class="nav-links">
                <li><a href="index.html#how-it-works">How It Works</a></li>
                <li><a href="archive.html">Archive</a></li>
                <li><a href="index.html#about">About Us</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="full-archive" class="section">
            <h2>The Complete Archive</h2>
            
            <div class="controls" style="display: flex; flex-direction: column; align-items: center; gap: 15px; margin-bottom: 40px;">
                
                <div>
                    <input type="text" id="search-input" placeholder="Search for a movie..." style="padding: 10px; width: 300px; font-size: 1rem; border: 2px solid #940000; background-color: #ffffff; color: #940000; outline: none; border-radius: 5px;">
                </div>

                <div>
                    <label for="sort-select">Sort by:</label>
                    <select id="sort-select">
                        <option value="date-desc">Newest to Oldest</option>
                        <option value="date-asc">Oldest to Newest</option>
                        <option value="rating-desc">Highest Rated</option>
                        <option value="rating-asc">Lowest Rated</option>
                    </select>
                </div>
            </div>

            <div class="grid-container" id="movie-grid">
                </div>
        </section>
    </main>

    <footer>
        <p><p>&copy; 2026 PICBLICK Filmclub Munich</p></p>
    </footer>

    <script>
        // --- PUT YOUR TMDB API KEY HERE ---
        const TMDB_API_KEY = 'd668617bc36509c65b03d5f395f1cf01';

        // --- YOU MUST UPDATE THIS LIST WHENEVER YOU WATCH A NEW MOVIE ---
        const movieArchive = [
            { title: "Drive", year: "2012", rating: "3.28/5", event: "", date: "26.08.2024" },
            { title: "Taste of Cherry", year: "1997", rating: "3.27/5", event: "", date: "16.11.2024" },
            { title: "Fargo", year: "1996", rating: "3.68/5", event: "Winter Special", date: "09.12.2024" }, 
            { title: "The Motorcycle Diaries", year: "2004", rating: "4.75/5", event: "Vacation/Trip Special", date: "09.03.2025" },
            { title: "Companion", year: "2025", rating: "3.00/5", event: "Horror Special", date: "11.04.2025" },
            { title: "Taipei Story", year: "1985", rating: "3.57/5", event: "", date: "20.09.2025" }
        ];

        let loadedMovies = []; 
        
        const grid = document.getElementById('movie-grid');
        const sortSelect = document.getElementById('sort-select');
        const searchInput = document.getElementById('search-input');

        function parseDate(dateStr) {
            const [day, month, year] = dateStr.split('.');
            return new Date(`${year}-${month}-${day}`).getTime();
        }

        function parseRating(ratingStr) {
            return parseFloat(ratingStr.split('/')[0]);
        }

        async function fetchMoviesData() {
            for (const movie of movieArchive) {
                try {
                    const response = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(movie.title)}&year=${movie.year}`);
                    const data = await response.json();
                    
                    let posterUrl = 'placeholder.jpg';
                    if (data.results && data.results.length > 0 && data.results[0].poster_path) {
                        posterUrl = `https://image.tmdb.org/t/p/original${data.results[0].poster_path}`;
                    }

                    loadedMovies.push({ ...movie, posterUrl });
                } catch (error) {
                    console.error('Error fetching data for', movie.title, error);
                }
            }
            
            filterAndSort();
        }

        // New function to handle both Searching and Sorting at the same time
        function filterAndSort() {
            const sortType = sortSelect.value;
            const searchTerm = searchInput.value.toLowerCase();
            
            // 1. Filter by search term
            let displayedMovies = loadedMovies.filter(movie => 
                movie.title.toLowerCase().includes(searchTerm) || 
                (movie.event && movie.event.toLowerCase().includes(searchTerm))
            );

            // 2. Sort the filtered results
            displayedMovies.sort((a, b) => {
                if (sortType === 'date-desc') return parseDate(b.date) - parseDate(a.date);
                if (sortType === 'date-asc') return parseDate(a.date) - parseDate(b.date);
                if (sortType === 'rating-desc') return parseRating(b.rating) - parseRating(a.rating);
                if (sortType === 'rating-asc') return parseRating(a.rating) - parseRating(b.rating);
                return 0;
            });

            renderGrid(displayedMovies);
        }

        function renderGrid(moviesToRender) {
            grid.innerHTML = ''; 
            
            if (moviesToRender.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1 / -1; text-align: center;">No movies found.</p>';
                return;
            }

            moviesToRender.forEach(movie => {
                let dateAndEventHTML = `<p class="movie-date">${movie.date}</p>`;
                if (movie.event) {
                    dateAndEventHTML = `<p class="movie-date"><span class="event-title">${movie.event}</span> &mdash; ${movie.date}</p>`;
                }

                const movieHTML = `
                    <div class="movie-item">
                        <img src="${movie.posterUrl}" alt="${movie.title} Poster" class="poster">
                        <h3>${movie.title}</h3>
                        <div class="rating">${movie.rating}</div>
                        ${dateAndEventHTML}
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', movieHTML);
            });
        }

        // Event Listeners for search typing and dropdown changing
        sortSelect.addEventListener('change', filterAndSort);
        searchInput.addEventListener('keyup', filterAndSort);

        fetchMoviesData();
    </script>
</body>
</html>
